# 동네자판기 Netlify 배포 설정
[build]
  command = "bundle exec jekyll build --config _config.yml,_config_netlify.yml"
  publish = "_site"
  # 크레딧 절약: 사이트에 안 보이는 파일(인수인계 문서·README)만 바뀐 경우 배포를 건너뜀
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)CLAUDE.md' ':(exclude)README.md'"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.3.6"

# 관리자 페이지는 검색엔진에 노출하지 않음
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# 120차(2026-10-28): 대표 주소를 전용 도메인으로 옮김 → 예전 넷리파이 주소로 오는 방문은 모두 새 주소로 영구 이동(301)
[[redirects]]
  from = "/*"
  to = "https://dongnevending.com/:splat"
  status = 301
  force = true
