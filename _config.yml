title: 동네자판기
description: 회사·학교·병원·무인매장 등 공간에 맞는 무인자판기 임대·설치·렌탈 상담
url: "https://dongnevending.com"
baseurl: ""   # 120차(2026-10-28): 전용 도메인 dongnevending.com 연결
# 대표 주소(검색엔진에 알려줄 정식 주소). canonical·og·RSS·robots가 모두 이 주소를 씀.
# GitHub Pages와 Netlify 두 곳에 배포돼도 대표 주소는 하나로 유지해야 중복 문서로 보지 않음
main_url: "https://dongnevending.com"
lang: ko
timezone: Asia/Seoul
future: true   # 관리자에서 쓴 글이 시간대 차이로 숨겨지지 않도록
permalink: /posts/:title/
markdown: kramdown
plugins:
  - jekyll-sitemap
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - _config_netlify.yml
  - vendor
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "admin" }
    values: { sitemap: false }
# 117차: 정보 글 작성자 표시(사용자 지정 2026-10-23)
author_name: "동네자판기"   # 122차(2026-10-28): 박시연은 실명 아님 → 사용자 요청으로 변경
