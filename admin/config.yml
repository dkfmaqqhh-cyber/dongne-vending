# 동네자판기 정보 글 관리자 (Sveltia CMS)
backend:
  name: github
  repo: dkfmaqqhh-cyber/dongne-vending
  branch: main

site_url: https://dkfmaqqhh-cyber.github.io/dongne-vending
locale: ko

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 정보 글
    label_singular: 정보 글
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} ({{date | date('YYYY.MM.DD')}})"
    fields:
      - { label: 레이아웃, name: layout, widget: hidden, default: post }
      - { label: 제목, name: title, widget: string }
      - { label: 날짜, name: date, widget: datetime }
      - label: 분류
        name: tag
        widget: select
        options: [설치 준비, 도입 방식, 상품 구성, 기종 비교, 냉장·냉동, 설치 과정, 설치 사례, 운영 팁]
      - { label: "카드 표지 문구 (줄바꿈은 ' / ')", name: cover, widget: string, required: false, hint: "예: 자판기 설치 전 / 확인할 5가지" }
      - label: 표지 색상
        name: color
        widget: select
        default: brown
        options:
          - { label: 브라운, value: brown }
          - { label: 오렌지, value: orange }
          - { label: 올리브, value: olive }
          - { label: 네이비, value: navy }
          - { label: 청록, value: teal }
          - { label: 레드, value: red }
      - { label: "표지 사진 (선택)", name: thumbnail, widget: image, required: false }
      - { label: 요약 (검색 설명), name: description, widget: text, hint: "목록 카드와 검색 결과에 보이는 1~2문장" }
      - { label: 본문, name: body, widget: markdown }
