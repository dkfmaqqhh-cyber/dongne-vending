<a class="pl-card" href="{{ include.p.url | relative_url }}"><div class="pl-cover c-{{ include.p.color | default: 'brown' }}{% if include.p.thumbnail and include.p.thumbnail != "" %} has-img{% endif %}"{% if include.p.thumbnail and include.p.thumbnail != "" %} style="background:url('{{ include.p.thumbnail | relative_url }}') center/cover"{% endif %}><strong>{{ include.p.cover | default: include.p.title | replace: ' / ', '<br/>' }}</strong></div><div class="pl-body"><span>{{ include.p.tag }}</span><h3>{{ include.p.title }}</h3><p>{{ include.p.description }}</p><em>{{ include.p.date | date: "%Y.%m.%d" }}</em></div></a>
