- id: seoul
  name: 서울
  intro: 오피스 빌딩과 학원가, 대학가, 역세권 상가가 많은 지역입니다. 건물 공용 공간처럼 자리가 한정된 곳은 설치 위치와 관리 주체 허락부터 확인합니다.
  page: /area/seoul/
- id: busan
  name: 부산
  intro: 해운대·광안리 일대 숙박시설과 항만·물류 시설, 대학가가 함께 있는 지역입니다. 관광객과 직장인 등 이용하는 사람에 따라 상품 구성이 달라집니다.
  page: /area/busan/
- id: daegu
  name: 대구
  intro: 병원과 학원, 호텔, 무인 매장 등 생활 시설이 고르게 있는 지역입니다. 대기 시간이 있는 공간인지, 늦은 시간에 이용하는 공간인지를 먼저 살펴봅니다.
  page: /area/daegu/
  alias:
  - gyeongsang
- id: incheon
  name: 인천
  intro: 공항과 항만, 산업단지, 송도·청라 같은 신도시가 함께 있는 지역입니다. 무인카페와 사업장 휴게 공간은 이용 시간대에 맞춰 구성을 잡습니다.
  page: /area/incheon/
- id: gwangju
  name: 광주
  intro: 하남·평동 산업단지와 수완·첨단 생활권이 있는 지역입니다. 건물 공용 공간과 사업장 휴게실은 전원과 반입 경로를 함께 확인합니다.
  page: /area/gwangju/
  alias:
  - jeolla
- id: daejeon
  name: 대전
  intro: 대덕연구개발특구와 정부대전청사, 대학가가 있는 지역입니다. 출입이 관리되는 건물은 설치 위치와 반입 절차를 미리 확인합니다.
  page: /area/daejeon/
- id: ulsan
  name: 울산
  intro: 자동차·조선·석유화학 사업장이 많은 지역입니다. 교대 근무가 있는 곳은 휴게실 위치와 근무 시간대를 기준으로 상품을 정합니다.
  page: /area/ulsan/
- id: sejong
  name: 세종
  intro: 정부세종청사와 이전 공공기관, 신도시 아파트 단지가 중심인 지역입니다. 청사 주변 상가와 아파트 커뮤니티는 이용자가 달라 구성을 나눠 봅니다.
  page: /area/sejong/
- id: gyeonggi
  name: 경기
  intro: 판교 같은 업무지구와 산업단지, 신도시 상권이 넓게 퍼져 있는 지역입니다. 코인노래방이나 키즈카페 같은 매장은 공간 크기에 맞춰 기종을 정합니다.
  page: /area/gyeonggi/
- id: gangwon
  name: 강원
  intro: 춘천·원주·강릉·속초 등 도시 간 거리가 있고 관광지와 숙박시설이 많은 지역입니다. 설치 일정은 장소와 반입 조건을 확인한 뒤 안내합니다.
  page: /area/gangwon/
- id: chungbuk
  name: 충북
  intro: 청주 오송·오창 산업단지와 대학가가 있는 지역입니다. 무인카페와 사업장 휴게 공간은 주로 찾는 상품과 설치 공간을 함께 살펴봅니다.
  alias:
  - chungcheong
  page: /area/chungbuk/
- id: chungnam
  name: 충남
  intro: 천안·아산 산업단지와 서산 대산 석유화학단지 등 사업장이 많은 지역입니다. 넓은 사업장은 어느 건물에 둘지부터 정하는 것이 좋습니다.
  page: /area/chungnam/
- id: jeonbuk
  name: 전북
  intro: 전주·군산·익산·정읍 등에 사업장과 대학가가 있는 지역입니다. 구내식당이나 사무실처럼 이용자가 정해진 곳은 자주 찾는 상품부터 구성합니다.
  page: /area/jeolla/
- id: jeonnam
  name: 전남
  intro: 여수 석유화학단지와 광양 제철소, 목포 상권 등 도시마다 공간 성격이 다른 지역입니다. PC카페 같은 매장은 영업시간에 맞춰 구성을 잡습니다.
  page: /area/jeolla/
- id: gyeongbuk
  name: 경북
  intro: 구미 국가산업단지와 포항 철강 산업, 안동·김천 생활권이 있는 지역입니다. 공장과 사무실은 근무 인원과 휴게 공간 위치를 기준으로 살펴봅니다.
  page: /area/gyeongsang/
- id: gyeongnam
  name: 경남
  intro: 창원 국가산업단지와 거제 조선소가 있는 지역입니다. 학교에 설치할 때는 판매할 수 있는 상품과 학교 측 허가를 먼저 확인합니다.
  page: /area/gyeongsang/
- id: jeju
  name: 제주
  intro: 호텔과 리조트 등 숙박시설, 관광지 상점이 많은 지역입니다. 설치 장소와 일정은 공간 정보를 확인한 뒤 미리 상의하는 것이 좋습니다.
  page: /area/jeju/
